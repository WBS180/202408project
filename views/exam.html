<body>
    <header>
        <h1>秋收 勞補(추수 로보)</h1>
        <p>로봇팔이 망에 걸려있는 과일을 수확합니다.</p>

        <div class="webcam">

            <!-- usb 로 연결한거 -->

            <!-- 스트리밍으로 -->
            <h1>Live Stream</h1>
            <button onclick="startStream()">Start Stream</button>
            <button onclick="stopStream()">Stop Stream</button>
            <br>
            <img id="stream" src="" alt="Live Stream">
            <!-- 스트리밍으로 -->
        </div>
        <div class="DBoutput">

                <tr>

                    <th>초록사과</th>

            <!-- -------------------- -->
            <table>
                <tr>
                    <!-- <th>id</th> -->
                    <th>과일</th>
                    <th>수확한 개수</th>
                    <th>시간</th>
                </tr>
                <% data.forEach(function(row) { %>
                <tr>
                    <!-- <td><%= row.id %></td> -->
                    <td><%= row.fruit %></td>
                    <td><%= row.quantity %></td>
                    <td><%= row.formatted_date %></td>
                </tr>
                <% }); %>
            </table>
        </div>
    </div>
    <div class="ECMU">
        <div class="esp32cam">
            <h1>esp32 cam</h1>
            <!-- <img src="image/mountain-g98f3ac1ab_1920.jpg" alt="임시 이미지"> -->
            <!-- rtps 하는거 -->
            
            <div class="controls"> 
                <button id="startStream">esp32 cam 켜기</button>
                <button id="stopStream">esp32 cam 끄기</button>
            </div>
            <canvas id="Canvas"></canvas>

            <!-- rtps 하는거 -->

            <!-- 좀 다름 -->
            <!-- <canvas id="videoCanvas"></canvas>
            <button id="startButton">Start Stream</button>
            <button id="stopButton">Stop Stream</button> -->
            <!-- 좀 다름 -->
        </div>
            <form id="harvest-form" class="menu">
                과일종류
                <select name="fruit" id="fruit_type">
                    <option>선택하세요</option>
                    <option value="apple_g">초록사과</option>
                    <option value="apple_r">빨간사과</option>
                    <option value="orange">귤</option>
                    <option value="pepper_r">빨간고추</option>
                    <option value="pepper_g">초록고추</option>
                    <option value="peach">복숭아</option>
                </select>
                숫자:<input type="text" id="fruit_count" name="quantity" placeholder="숫자만 입력">
                <div class="harvest-button">
                    <input type="submit" value="수확하기">
                </div>
            </form>
            <!-- <div class="graph-container" style="display: none;">
                <canvas id="harvestChart"></canvas>
            </div> -->
    </div>
    
    <div>
        <!-- Calendar to select date -->
        <input type="date" id="datePicker" class="Calendar">
    </div>
        
    <!-- Container for the graph -->
    <div class="graph-container" style="display: none;">
        <canvas id="harvestChart"></canvas>
    </div>

    <script src="js/script.js"></script>
